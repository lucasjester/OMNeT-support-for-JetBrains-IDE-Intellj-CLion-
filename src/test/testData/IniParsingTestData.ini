# INI Parsing Test Data — covers all grammar constructs
# This file is parsed by IniParsingTest to verify the PSI tree structure.

[General]
network = TestNetwork
sim-time-limit = 100s
**.bitrate = 100Mbps

# String, boolean, number values
*.app[0].typename = "UdpBasicApp"
*.enabled = true
*.count = 42
*.speed = -5.0

# Function calls
*.app[0].sendInterval = exponential(1s)
*.configurator.config = xmldoc("config.xml", "/config")
*.node[*].mobility.initialX = uniform(0m, 500m)

# Array values
*.gate[0].durations = [20us, 980us]
*.protocols = ["ieee8021qctag"]

# Array with objects
*.mapping = [{stream: "best-effort", pcp: 0},
             {stream: "high-priority", pcp: 4}]

# Arithmetic expressions
*.packetLength = 1500B - 58B
result-dir = results/advanced

# Include directive
include ../shared.ini

# Section with config name
[Config TimeAwareShaping]
description = "Time-aware traffic shaping example"

# Iteration variables
*.numHosts = ${N=1, 2, 5, 10}
**.sendInterval = exponential(${mean=0.2, 0.4}s)

# Space-separated units (permissive value)
**.messageLength = 32 bytes

# Deeply nested expression (falls through to parenGroup)
*.filter = expr((has(Sync) && Sync.domain == 0) || (has(FollowUp) && FollowUp.domain == 0))

# Ternary and comparison operators
*.mode = ${N} > 5 ? "fast" : "slow"

# Line continuation
*.longValue = "first part" + \
              "second part"

# Single-quoted string
*.path = '/usr/local/etc'

# Bare variable reference
*.repeat = $repetition

# Comments: both # and // styles
# hash comment
// slash comment
*.value = 100  # inline hash comment
*.other = 200  // inline slash comment