# General configuration
[General]
network = TestNetwork
sim-time-limit = 100s
**.vector-recording = false

# Named configuration
[Config Tictoc1]
description = "First experiment"
*.host.numApps = 1
*.host.app[0].typename = "UdpBasicApp"
*.host.app[0].destPort = 5000
*.host.app[0].messageLength = 1000B
*.host.app[0].sendInterval = exponential(1s)

# Complex values: arrays, objects, function calls
[Config TimeAwareShaping]
*.switch.eth[*].macLayer.queue.transmissionGate[0].durations = [20us, 980us]
*.switch.eth[*].macLayer.queue.transmissionGate[1].durations = [980us, 20us]
*.switch.bridging.streamFilter.ingress.meter[0].committedInformationRate = 41.68Mbps
*.scenarioManager.script = xmldoc("scenario.xml")
*.configurator.config = xmldoc("config.xml", "/config")

# Negative numbers and arithmetic
[Config Advanced]
*.node[*].mobility.initialX = uniform(0m, 500m)
*.node[*].mobility.speed = -5.0
result-dir = results/advanced