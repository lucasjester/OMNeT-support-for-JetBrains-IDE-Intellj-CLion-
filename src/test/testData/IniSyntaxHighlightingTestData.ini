# ============================================================
#  IniSyntaxHighlightingTestData.ini
#  Comprehensive INI lexer coverage. Each block exercises a
#  specific feature, state transition, or token type from
#  Ini.flex.
# ============================================================

# ─── Comment styles (YYINITIAL) ───
# Hash comment
; Semicolon comment
// Slash comment

[General]

# ─── INCLUDE directive ───
include ../shared.ini

# ─── EQ ───
network = TestNetwork

# ─── KEY variants: wildcards, subscripts, ranges, ?, :, $ ───
*.app[0].typename = "Type"
**.bitrate = 100Mbps
*.host{0..10}.foo = 1
**.what?ever = 2
*.module:statistic = 3
*.$dynamic.foo = 4

# ─── NUMBER and NEG_NUMBER ───
*.int = 42
*.float = -5.0
*.scientific = 1.5e-3
*.unit = 1500B

# ─── BOOLEAN ───
*.on = true
*.off = false

# ─── STRING: DSTRING and SSTRING ───
*.dq = "double-quoted"
*.sq = '/single-quoted'

# ─── Multi-line via LINE_CONT (backslash-newline) ───
*.cont = "part1" + \
         "part2"

# ─── Multi-line via YYINITIAL recovery (no backslash) ───
*.recover = "part1" +
"part2"

# ─── FUNC_CALL: simple and with multiple args ───
*.simple = exponential(1s)
*.multi  = xmldoc("config.xml", "/cfg")

# ─── ITER_VAR (${...}) and BARE_VAR ($name) ───
*.iter = ${N=1, 2, 5, 10}
*.bare = $repetition

# ─── INLINE_COMMENT (AFTER_EQ → YYINITIAL via inline comment) ───
*.with-hash  = 100  # trailing hash
*.with-slash = 200  // trailing slash
*.with-semi  = 300  ; trailing semicolon

# ─── ARITH_OP: arithmetic, bitwise, compare, logical, ternary, range ───
# (Token-stream test: lexer does not validate semantic correctness)
*.arith   = 1 + 2 - 3 * 4 / 5 % 6 ^ 7 ~ 8
*.bitwise = 1 & 2 | 3
*.compare = 5 == 6 != 7 <= 8 >= 9 < 10 > 11
*.logical = true && false || !true
*.cond    = ${N} > 5 ? "fast" : "slow"
*.range   = 1 .. 10

# ─── LPAREN / RPAREN (outside FUNC_CALL) ───
*.parens = (1 + 2) * 3

# ─── Leading-dot value: ARITH_OP `.` followed by NUMBER ───
*.leading = .5s

# ─── Arrays (IN_ARRAY): flat and empty ───
*.flat  = [20us, 980us]
*.empty = []

# ─── Objects (IN_OBJECT): MAP_KEY and DSTRING_MAP_KEY ───
*.obj         = {key: 1, other: "val"}
*.string-keys = {"eth0": 1, "eth1": 2}

# ─── Nested structures (state stack) ───
*.matrix        = [[1, 2], [3, 4]]
*.deep-obj      = {outer: {inner: 1}}
*.array-of-objs = [{stream: "be", pcp: 0}, {stream: "hp", pcp: 4}]
*.obj-of-array  = {sizes: [1, 2, 3]}

# ─── LINE_CONT in IN_ARRAY ───
*.long-array = [\
                 1, 2, 3\
               ]

# ─── LINE_CONT in IN_OBJECT ───
*.long-obj = {a: 1,\
              b: 2}

# ─── Section with config name and dotted name ───
[Config TimeAwareShaping]
description = "scenario"
*.app[0].sendInterval = exponential(${mean=0.2, 0.4}s)

[Config X.Y.Z]
*.foo = 1
