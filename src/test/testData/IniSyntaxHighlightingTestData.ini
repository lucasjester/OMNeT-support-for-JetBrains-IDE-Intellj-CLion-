# Hash comment
// Slash comment

[General]
network = TestNetwork
sim-time-limit = 100s
**.bitrate = 100Mbps

# String, boolean, number values
*.app[0].typename = "UdpBasicApp"
*.enabled = true
*.count = 42

# Function call
*.app[0].sendInterval = exponential(1s)

# Array value
*.durations = [20us, 980us]

# Include directive
include ../shared.ini

[Config TimeAwareShaping]
description = "Time-aware shaping"
*.numHosts = ${N=1, 2, 5, 10}